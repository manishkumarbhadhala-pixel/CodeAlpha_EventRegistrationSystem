<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Registration System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f4f4;
    }
    h1, h2 {
      color: #333;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    .event-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .event-card h3 {
      margin: 0 0 5px 0;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 6px;
    }
    button:hover {
      background-color: #45a049;
    }
    .cancel-btn {
      background-color: #e74c3c;
    }
    .cancel-btn:hover {
      background-color: #c0392b;
    }
    #message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .success {
      background-color: #e9f7ef;
      color: #1e7e34;
    }
    .error {
      background-color: #fdecea;
      color: #b71c1c;
    }
  </style>
</head>
<body>

  <h1>Event Registration System</h1>

  <!-- Section 1: Events List -->
  <div class="container">
    <h2>Upcoming Events</h2>
    <div id="eventsList">Loading events...</div>
  </div>

  <!-- Section 2: Register Form -->
  <div class="container">
    <h2>Register for an Event</h2>
    <input type="number" id="eventIdInput" placeholder="Event ID (from list above)">
    <input type="text" id="nameInput" placeholder="Your Name">
    <input type="email" id="emailInput" placeholder="Your Email">
    <button onclick="registerForEvent()">Register</button>
    <div id="message"></div>
  </div>

  <!-- Section 3: View My Registrations -->
  <div class="container">
    <h2>My Registrations</h2>
    <input type="email" id="searchEmailInput" placeholder="Enter your email to view registrations">
    <button onclick="loadMyRegistrations()">View</button>
    <div id="myRegistrations" style="margin-top: 15px;"></div>
  </div>

  <script>
    // Page load hote hi events list dikhao
    window.onload = loadEvents;

    async function loadEvents() {
      const eventsList = document.getElementById('eventsList');
      try {
        const res = await fetch('/api/events');
        const data = await res.json();

        if (data.events.length === 0) {
          eventsList.innerHTML = 'No events found.';
          return;
        }

        eventsList.innerHTML = data.events.map(event => `
          <div class="event-card">
            <h3>${event.title} (ID: ${event.id})</h3>
            <p>${event.description || ''}</p>
            <p><strong>Date:</strong> ${event.event_date} &nbsp; <strong>Location:</strong> ${event.location}</p>
            <p><strong>Total Seats:</strong> ${event.total_seats}</p>
          </div>
        `).join('');

      } catch (error) {
        eventsList.innerHTML = 'Failed to load events.';
      }
    }

    async function registerForEvent() {
      const event_id = document.getElementById('eventIdInput').value;
      const name = document.getElementById('nameInput').value;
      const email = document.getElementById('emailInput').value;
      const messageDiv = document.getElementById('message');

      try {
        const res = await fetch('/api/registrations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ event_id, name, email })
        });

        const data = await res.json();
        messageDiv.style.display = 'block';

        if (!res.ok) {
          messageDiv.className = 'error';
          messageDiv.innerHTML = data.error;
          return;
        }

        messageDiv.className = 'success';
        messageDiv.innerHTML = `Registered successfully for "${data.event}"`;

      } catch (error) {
        messageDiv.style.display = 'block';
        messageDiv.className = 'error';
        messageDiv.innerHTML = 'Something went wrong';
      }
    }

    async function loadMyRegistrations() {
      const email = document.getElementById('searchEmailInput').value;
      const container = document.getElementById('myRegistrations');

      if (!email) {
        container.innerHTML = 'Please enter an email';
        return;
      }

      try {
        const res = await fetch(`/api/registrations/${email}`);
        const data = await res.json();

        if (data.registrations.length === 0) {
          container.innerHTML = 'No registrations found for this email.';
          return;
        }

        container.innerHTML = data.registrations.map(r => `
          <div class="event-card">
            <h3>${r.title}</h3>
            <p><strong>Date:</strong> ${r.event_date} &nbsp; <strong>Location:</strong> ${r.location}</p>
            <p><strong>Registration ID:</strong> ${r.registration_id}</p>
            <button class="cancel-btn" onclick="cancelRegistration(${r.registration_id})">Cancel</button>
          </div>
        `).join('');

      } catch (error) {
        container.innerHTML = 'Failed to load registrations.';
      }
    }

    async function cancelRegistration(id) {
      try {
        const res = await fetch(`/api/registrations/${id}`, { method: 'DELETE' });
        const data = await res.json();

        if (res.ok) {
          alert(data.message);
          loadMyRegistrations();
        } else {
          alert(data.error);
        }
      } catch (error) {
        alert('Failed to cancel registration');
      }
    }
  </script>
</body>
</html>
